name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'  # daily, 06:17 in Argentina

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out estadorutas with full history
        uses: actions/checkout@v4
        with:
          repository: j-e-d/estadorutas
          path: estadorutas
          fetch-depth: 0
      - run: ./build.sh estadorutas
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
